<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Sign Up</h1>
    <form>
    <label for="username">Name:</label>
    <input type="text" id="username" name="username" placeholder="Enter your username" required><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required><br><br>
    <label for="course">Course:</label>
    <select id="course" name="course" required>
        <option value="">Select a course</option>
        <option value="course1">mern stack</option>
        <option value="course2">Data analyst</option>
        <option value="course3">Java full stack</option>
    </select><br><br>
    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label><br><br>
    <label for=""interests">Interests:</label>
    <input type="checkbox" id="interest1" name="interests" value="interest1">
    <label for="interest1">Web Development</label>
    <input type="checkbox" id="interest2" name="interests" value="interest2">
    <label for="interest2">Data Science</label>
    <input type="checkbox" id="interest3" name="interests" value="interest3">
    <label for="interest3">Machine Learning</label><br><br>
    <label for="address">Address:</label>
    <textarea id="address" name="address" placeholder="Enter your address" required></textarea><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
    <label for="confirm-password">Confirm Password:</label>
    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required><br><br>
    <button type="submit">Sign Up</button><br><br>
    <button reset>Reset</button>
    <p>Already have an account? <a href="form.html">Login</a></p>
    
</form>
</body>
</html>
